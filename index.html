<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吉田村風土記</title>
  <meta name="description" content="吉田村の地図の点をクリックすると、その場所の解説と写真が表示されます。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>吉田村風土記</h1>
    <p class="lead">地図の点をクリックすると、その場所の解説と写真が下に表示されます。</p>
  </header>

  <main>
    <div id="map" role="application" aria-label="吉田村の地図"></div>
    <p id="notice" class="notice" role="status" hidden></p>

    <nav class="point-nav" aria-label="ポイント一覧">
      <ul id="point-list" class="point-list"></ul>
    </nav>

    <section id="panel" class="panel" aria-live="polite">
      <p class="placeholder">地図上の点、または上の一覧から場所を選んでください。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>地図：<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院タイル</a></p>
  </footer>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="写真の拡大表示">
    <button id="lightbox-close" class="lightbox-close" type="button" aria-label="閉じる">×</button>
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-cap"></figcaption>
    </figure>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
