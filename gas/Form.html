<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 16px; font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; line-height: 1.7; color: #2b2118; background: #faf6ee; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.3rem; color: #7a3b12; margin: 0 0 4px; }
    .hint { color: #6d5f52; font-size: 0.85rem; margin: 0 0 16px; }
    label { display: block; font-weight: bold; margin: 12px 0 4px; }
    input[type=text], input[type=password], select, textarea { width: 100%; padding: 8px; font: inherit; border: 1px solid #c9bca5; border-radius: 4px; background: #fff; }
    textarea { min-height: 110px; resize: vertical; }
    button { font: inherit; padding: 8px 16px; border: 1px solid #7a3b12; border-radius: 4px; background: #fff; color: #7a3b12; cursor: pointer; }
    button.primary { background: #7a3b12; color: #fff; }
    button:disabled { opacity: 0.5; cursor: default; }
    fieldset { margin: 20px 0; padding: 8px 14px 14px; border: 1px solid #d9cdb8; border-left: 4px solid #c0622b; background: #fffdf8; }
    legend { font-weight: bold; padding: 0 6px; }
    .existing { font-size: 0.8rem; color: #6d5f52; margin: 6px 0 0; }
    .previews { list-style: none; margin: 8px 0 0; padding: 0; }
    .previews li { display: flex; gap: 8px; align-items: center; margin: 6px 0; padding: 6px; border: 1px solid #e3d9c6; background: #fff; }
    .previews img { width: 72px; height: 54px; object-fit: cover; flex: none; }
    .previews input { flex: 1; min-width: 0; }
    .previews .state { font-size: 0.75rem; flex: none; }
    .previews .state.error { color: #b00020; }
    #status { margin: 16px 0; padding: 10px; border-radius: 4px; background: #eef3f8; white-space: pre-wrap; }
    #status.error { background: #fde8e8; color: #8a1c1c; }
    #status.ok { background: #e6f4ea; color: #1e5b2d; }
    #status:empty { display: none; }
  </style>
</head>
<body>
<main>
  <h1>吉田村風土記　登録フォーム</h1>
  <p class="hint">ポイントを選び、章ごとに解説と写真を入力して「保存する」を押してください。空の章は公開サイトに表示されません。</p>

  <label for="password">合言葉</label>
  <input type="password" id="password" autocomplete="off">

  <label for="point">ポイント</label>
  <select id="point"><option value="">読み込み中…</option></select>
  <p style="margin-top:10px"><button type="button" id="open">このポイントを開く</button></p>

  <div id="status" role="status" aria-live="polite"></div>

  <form id="editor" hidden>
    <div id="chapters"></div>
    <button type="submit" class="primary" id="save">保存する</button>
  </form>
</main>

<script>
  // ※ app.js の CHAPTERS と同じ内容にしておくこと。
  var CHAPTERS = [
    { key: "ch1", title: "第1章：吉田の地形と自然(空間)" },
    { key: "ch2", title: "第2章：吉田の歴史と信仰(時間)" },
    { key: "ch3", title: "第3章：歴史的な建物と建造物(風景)" },
    { key: "ch4", title: "第4章：学校と学術文化(教育・文化)" },
    { key: "ch5", title: "第5章：暮らしの移り変わり(生活)" },
    { key: "ch6", title: "第6章：吉田の自然と風景(自然)" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var pending = {};      // 章ごとの「これから送る写真」 { ch1: [ {dataUrl, caption, state, error} ] }
  var ui = {};           // 章ごとの画面部品
  var busy = false;

  function setStatus(msg, kind) {
    var el = $("status");
    el.textContent = msg || "";
    el.className = kind || "";
  }

  function run(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }

  function errText(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ""); }

  // ----- 画面の組み立て -----
  function buildChapters() {
    var wrap = $("chapters");
    wrap.textContent = "";
    CHAPTERS.forEach(function (c) {
      pending[c.key] = [];

      var fs = document.createElement("fieldset");
      var lg = document.createElement("legend");
      lg.textContent = c.title;
      fs.appendChild(lg);

      var ta = document.createElement("textarea");
      ta.maxLength = 5000;
      ta.setAttribute("aria-label", c.title + " の解説");
      ta.placeholder = "この章の解説（なければ空欄のままで）";
      fs.appendChild(ta);

      var ex = document.createElement("p");
      ex.className = "existing";
      fs.appendChild(ex);

      var file = document.createElement("input");
      file.type = "file";
      file.accept = "image/*";
      file.multiple = true;
      file.setAttribute("aria-label", c.title + " の写真を追加");
      file.style.marginTop = "10px";
      fs.appendChild(file);

      var ul = document.createElement("ul");
      ul.className = "previews";
      fs.appendChild(ul);

      file.addEventListener("change", function () { addFiles(c.key, file); });
      wrap.appendChild(fs);
      ui[c.key] = { textarea: ta, existing: ex, list: ul };
    });
  }

  function renderPreviews(key) {
    var ul = ui[key].list;
    ul.textContent = "";
    pending[key].forEach(function (item, idx) {
      var li = document.createElement("li");
      var img = document.createElement("img");
      img.src = item.dataUrl;
      img.alt = "";
      var cap = document.createElement("input");
      cap.type = "text";
      cap.maxLength = 200;
      cap.placeholder = "キャプション（撮影年・撮影者・出典など）";
      cap.value = item.caption;
      cap.addEventListener("input", function () { item.caption = cap.value; });
      var st = document.createElement("span");
      st.className = "state" + (item.state === "error" ? " error" : "");
      st.textContent = item.state === "error" ? "失敗: " + item.error : "";
      var rm = document.createElement("button");
      rm.type = "button";
      rm.textContent = "取り消し";
      rm.addEventListener("click", function () { pending[key].splice(idx, 1); renderPreviews(key); });
      li.appendChild(img); li.appendChild(cap); li.appendChild(st); li.appendChild(rm);
      ul.appendChild(li);
    });
  }

  function showExistingCounts(counts) {
    CHAPTERS.forEach(function (c) {
      var n = (counts && counts[c.key]) || 0;
      ui[c.key].existing.textContent = n ? "登録済みの写真：" + n + "枚（新しい写真は追加されます）" : "";
    });
  }

  // ----- 写真の縮小（長辺1200px、JPEG）。このとき位置情報などのEXIFは消えます -----
  function resizeImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
        var w = Math.round(img.naturalWidth * scale);
        var h = Math.round(img.naturalHeight * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("画像を読み込めませんでした: " + file.name));
      };
      img.src = url;
    });
  }

  function addFiles(key, input) {
    var files = Array.prototype.slice.call(input.files || []);
    input.value = "";
    if (!files.length) return;
    setStatus("写真を縮小しています…");
    files.reduce(function (p, f) {
      return p.then(function () {
        return resizeImage(f).then(function (dataUrl) {
          pending[key].push({ dataUrl: dataUrl, caption: "", state: "ready", error: "" });
        }).catch(function (e) { setStatus(errText(e), "error"); });
      });
    }, Promise.resolve()).then(function () {
      renderPreviews(key);
      if ($("status").className !== "error") setStatus("");
    });
  }

  // ----- 「このポイントを開く」 -----
  $("open").addEventListener("click", function () {
    var id = $("point").value;
    if (!id) { setStatus("ポイントを選んでください。", "error"); return; }
    if (!$("password").value) { setStatus("合言葉を入力してください。", "error"); return; }
    setStatus("読み込み中…");
    $("open").disabled = true;
    run("getPointForEdit", $("password").value, id).then(function (res) {
      buildChapters();
      CHAPTERS.forEach(function (c) { ui[c.key].textarea.value = (res.chapters && res.chapters[c.key]) || ""; });
      showExistingCounts(res.photoCounts);
      $("editor").hidden = false;
      setStatus("");
    }).catch(function (e) {
      $("editor").hidden = true;
      setStatus(errText(e), "error");
    }).then(function () { $("open").disabled = false; });
  });

  // ----- 「保存する」 -----
  $("editor").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy) return;
    busy = true;
    $("save").disabled = true;
    var pw = $("password").value;
    var id = $("point").value;
    var texts = {};
    CHAPTERS.forEach(function (c) { texts[c.key] = ui[c.key].textarea.value; });

    var jobs = [];
    CHAPTERS.forEach(function (c) {
      pending[c.key].forEach(function (item) { jobs.push({ key: c.key, item: item }); });
    });

    setStatus("解説を保存しています…");
    run("saveChapters", pw, id, texts).then(function () {
      var done = 0, failed = 0;
      return jobs.reduce(function (p, job) {
        return p.then(function () {
          setStatus("写真をアップロード中… (" + (done + failed + 1) + " / " + jobs.length + ")");
          return run("uploadPhoto", pw, id, job.key, job.item.caption, job.item.dataUrl).then(function () {
            job.item.state = "done"; done++;
          }).catch(function (e) {
            job.item.state = "error"; job.item.error = errText(e); failed++;
          });
        });
      }, Promise.resolve()).then(function () { return { done: done, failed: failed }; });
    }).then(function (r) {
      CHAPTERS.forEach(function (c) {
        pending[c.key] = pending[c.key].filter(function (it) { return it.state !== "done"; });
        renderPreviews(c.key);
      });
      return run("getPointForEdit", pw, id).then(function (res) { showExistingCounts(res.photoCounts); }).then(function () {
        if (r.failed) {
          setStatus("解説は保存しました。写真は " + r.done + " 枚成功、" + r.failed + " 枚失敗しました。失敗した写真は画面に残してあるので、もう一度「保存する」を押してください。", "error");
        } else {
          setStatus("保存しました（写真 " + r.done + " 枚）。公開サイトを再読み込みすると反映されます。", "ok");
        }
      });
    }).catch(function (e) {
      setStatus("保存に失敗しました: " + errText(e), "error");
    }).then(function () {
      busy = false;
      $("save").disabled = false;
    });
  });

  // ----- ポイント一覧の読み込み -----
  run("getPointList").then(function (list) {
    var sel = $("point");
    sel.textContent = "";
    var first = document.createElement("option");
    first.value = ""; first.textContent = "選んでください";
    sel.appendChild(first);
    list.forEach(function (p) {
      var o = document.createElement("option");
      o.value = p.id;
      o.textContent = p.id + "　" + p.name;
      sel.appendChild(o);
    });
  }).catch(function (e) {
    $("point").textContent = "";
    setStatus("ポイント一覧を読み込めませんでした: " + errText(e), "error");
  });
</script>
</body>
</html>
